name: Correctness tests
on: [push, pull_request]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 56379:6379
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ridepulse_test
          POSTGRES_USER: ridepulse_test
          POSTGRES_PASSWORD: local_test_only
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -U ridepulse_test -d ridepulse_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://ridepulse_test:local_test_only@localhost:55433/ridepulse_test
      TEST_REDIS_URL: redis://localhost:56379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-test.txt
      - run: python -m unittest discover -s tests -v
